name: Publish Irix to npm

# Every push to `irix` verifies the edition: brand and release script tests, dependency
# licenses, build, typecheck, lint, formatting and the Irix tests, on Linux and on Windows.
#
# The `publish` job is switched off (`if: ${{ false }}`): CI here runs the checks and publishes
# nothing, whatever the repository variables say. Packages are built locally with
# `node irix/scripts/pack-local.mjs`. To publish from CI again, set that condition back to
# `${{ vars.NPM_SCOPE != '' }}` and follow irix/README.md ("Publishing").
#
# This workflow never creates a `v*` tag. Upstream's release workflows trigger on `v*` tags,
# so tag this branch with another prefix (for example `irix-20261010`).

on:
  push:
    branches: [irix]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and run `npm publish --dry-run` without publishing"
        type: boolean
        default: false

concurrency:
  group: publish-irix
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Not needed to build, and the onnxruntime-node postinstall download is large and flaky.
  ONNXRUNTIME_NODE_INSTALL: skip
  PUBLISH_NODE_VERSION: "22"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          cache: npm

      # The brand tests include a dry run against the real tree: they fail when an upstream
      # sync moves something the brand replaces.
      - name: Brand and release script tests
        run: node --test "irix/scripts/*.test.mjs"

      # Publishing stops if anything we ship needs a license we must not distribute under
      # (GPL, AGPL, SSPL, BUSL, unlicensed). `review` entries are listed but do not stop it.
      - name: Dependency licenses
        run: node irix/scripts/license-audit.mjs

      # --ignore-scripts skips native builds; the root postinstall applies patches/ that the
      # web UI requires.
      - name: Install dependencies
        run: |
          node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
          npm run postinstall

      - name: Build server stack
        run: npm run build:server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Irix's own behaviour: egress guard, provider and plugin policy, GitLab through
      # python-gitlab (including the contract tests against upstream's GitLab service), clone
      # policy. Upstream runs its full suites in ci.yml.
      - name: Irix tests (server)
        working-directory: packages/server
        run: npx vitest run --bail=1 src/irix

      - name: Irix tests (bundled plugin)
        working-directory: plugins
        run: npx vitest run --bail=1 irix-gitlab

      - name: Irix tests (app)
        working-directory: packages/app
        run: npx vitest run --bail=1 src/irix

  # Irix's members run Windows, so the Irix tests also run there: paths, native dialogs'
  # commands and git behave differently. Upstream's own suites run in ci.yml.
  verify-windows:
    name: verify (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          cache: npm

      - name: Brand and release script tests
        shell: bash
        run: node --test "irix/scripts/*.test.mjs"

      - name: Install dependencies
        shell: bash
        run: |
          node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
          npm run postinstall

      - name: Build server stack
        run: npm run build:server

      - name: Irix tests (server)
        working-directory: packages/server
        run: npx vitest run --bail=1 src/irix

      - name: Irix tests (bundled plugin)
        working-directory: plugins
        run: npx vitest run --bail=1 irix-gitlab

      - name: Irix tests (app)
        working-directory: packages/app
        run: npx vitest run --bail=1 src/irix

      # The script anyone can run to build the packages themselves (see irix/README.md),
      # run for real on Windows. A short work dir keeps node_modules under the 260-character limit.
      - name: Pack the tarballs
        run: node irix/scripts/pack-local.mjs --out dist-npm --work-dir C:\irix

      - name: Keep the Windows-built tarballs
        uses: actions/upload-artifact@v4
        with:
          name: irix-windows-built-tarballs
          path: |
            dist-npm/*.tgz
            dist-npm/*.zip
          retention-days: 7

  publish:
    name: publish
    needs: [verify, verify-windows]
    # Switched off on purpose: CI runs the checks only and never publishes. To turn publishing
    # back on, use `${{ vars.NPM_SCOPE != '' }}` here; see irix/README.md ("Publishing").
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Create this environment to hold NPM_TOKEN and, if you want, require a reviewer.
    environment: npm-publish
    permissions:
      contents: read
      packages: write
    env:
      NPM_SCOPE: ${{ vars.NPM_SCOPE }}
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      NPM_ACCESS: ${{ vars.NPM_ACCESS || 'restricted' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      # GitHub Packages accepts the workflow token. Any other registry needs NPM_TOKEN.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
      # Compiled into the web UI: no voice, no upstream links, Add Project goes to GitLab.
      EXPO_PUBLIC_IRIX: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          cache: npm
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: "@${{ env.NPM_SCOPE }}"

      # The source keeps the upstream name and npm scope so upstream merges stay small. Both
      # are rewritten in this throwaway checkout only, before installing, so the lockfile and
      # workspaces agree.
      - name: Rename the npm scope
        run: node irix/scripts/rename-npm-scope.mjs --scope "$NPM_SCOPE"

      - name: Apply the brand
        run: node irix/scripts/brand.mjs

      - name: Install dependencies
        run: |
          node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
          npm run postinstall

      # Upstream version with its prerelease stripped, plus the run number: 0.11.2-irix.58.
      # Prereleases sort below the bare version, which this workflow never publishes, and
      # the run number keeps successive builds in order.
      - name: Set the version
        id: version
        run: |
          core="$(node -p "require('./package.json').version.split('-')[0]")"
          version="${core}-irix.${GITHUB_RUN_NUMBER}"
          npm pkg set version="$version"
          node scripts/sync-workspace-versions.mjs
          # The app is not published, and its Expo config only accepts x.y.z or x.y.z-beta.N,
          # so it keeps the upstream version.
          npm pkg set version="$core" --workspace="@${NPM_SCOPE}/app"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version under @$NPM_SCOPE"

      # Apache-2.0 §4: every package ships upstream's LICENSE and a NOTICE saying it is a modified
      # version of Paseo.
      - name: Add the license and notice
        run: node irix/scripts/add-license.mjs

      # Packing builds each package; the server's prepack builds the web UI.
      - name: Pack
        run: |
          mkdir -p dist-npm
          for p in highlight relay protocol client plugin server cli; do
            npm pack --workspace="@${NPM_SCOPE}/${p}" --pack-destination dist-npm
          done
          ls -l dist-npm

      # Install the tarballs together, exactly as users do, and check the result is Irix at
      # the version we are about to publish.
      - name: Smoke test the tarballs
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install -g --prefix "$RUNNER_TEMP/smoke" ./dist-npm/*.tgz
          lib="$RUNNER_TEMP/smoke/lib/node_modules/@${NPM_SCOPE}"
          "$RUNNER_TEMP/smoke/bin/irix" --version | grep -F "$EXPECTED_VERSION"
          test -f "$lib/server/dist/server/irix/edition.js"
          test -f "$lib/server/dist/server/builtin-plugins/irix-gitlab/paseo-plugin.json"
          test -f "$lib/server/dist/server/web-ui/index.html"
          # The web UI carries the brand.
          grep -q '"short_name": "Irix"' "$lib/server/dist/server/web-ui/manifest.json"
          # Every package carries the license and the notice, and says Apache-2.0.
          for p in highlight relay protocol client plugin server cli; do
            test -f "$lib/$p/LICENSE"
            grep -q "Apache License" "$lib/$p/LICENSE"
            grep -q "modified version of Paseo" "$lib/$p/NOTICE"
            test "$(node -p "require('$lib/$p/package.json').license")" = "Apache-2.0"
          done
          # Nothing may still point at the upstream scope.
          if grep -rl "@getpaseo/" "$lib"; then
            echo "A tarball still references the upstream @getpaseo scope" >&2
            exit 1
          fi

      - name: Publish
        run: >
          node irix/scripts/publish.mjs
          --dir dist-npm
          --scope "$NPM_SCOPE"
          --registry "$NPM_REGISTRY"
          --access "$NPM_ACCESS"
          --tag latest
          $([ "$DRY_RUN" = "true" ] && echo --dry-run)

      - name: Keep the tarballs
        uses: actions/upload-artifact@v4
        with:
          name: irix-npm-${{ steps.version.outputs.version }}
          path: dist-npm/*.tgz
          retention-days: 30
